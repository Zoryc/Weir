# Checks every push and pull request: lint and unit tests on Linux and Windows, then
# start the app off-screen on Linux and render it with the layout checker
# (screenshots are kept as an artifact). The Release workflow runs the same tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt's runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - name: Install Python requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m pyflakes main.py core ui tools tests
      - name: Unit tests
        run: python -m pytest

  render:
    name: Render the window (Linux)
    needs: test
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Start the app and render the window
        run: python tools/screenshots.py --out screenshots
      - name: Check the layout
        # Linux fonts differ from Windows; layout findings are reported, not blocking.
        continue-on-error: true
        run: python tools/screenshots.py --check --out screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn
