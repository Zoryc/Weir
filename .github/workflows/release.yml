# Builds the Windows installer and the Linux AppImage, then publishes a GitHub release.
# Triggered by pushing a version tag:  git tag v1.0.0 && git push origin v1.0.0
# The tag must match core.APP_VERSION. Release notes come from CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    name: Tests
    # Never publish a release whose tests fail: reuse the CI workflow's checks.
    uses: ./.github/workflows/ci.yml

  windows:
    name: Windows installer
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the app version
        shell: bash
        run: |
          version="$(python -c 'import core; print(core.APP_VERSION)')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match APP_VERSION $version in core/__init__.py"
            exit 1
          fi
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build the app and the installer
        shell: cmd
        run: build_installer.bat
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Weir-Setup-*.exe
          if-no-files-found: error

  linux:
    name: Linux AppImage
    needs: tests
    # The oldest supported runner: the AppImage then runs on distributions with glibc >= 2.35.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3 fonts-dejavu-core file
      - name: Build the app and the AppImage
        env:
          PYTHON: python
        run: ./build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/Weir-*.AppImage
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Write the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p = index($0, "## " v " ") == 1; next} p' CHANGELOG.md > notes.md
          sed "s/{version}/$version/g" .github/release-download.md >> notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "Weir ${GITHUB_REF_NAME#v}" --notes-file notes.md
